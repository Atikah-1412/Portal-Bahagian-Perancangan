<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Laporan Bergambar - Bahagian Perancangan JPS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .glass-header { background: linear-gradient(135deg, #ffffff 0%, #f5f3ff 100%); border: 1px solid #e2e8f0; }
    .tab-active { background: linear-gradient(135deg, #7e22ce, #db2777); color: #ffffff; box-shadow: 0 4px 12px rgba(126, 34, 206, 0.25); }
    .tab-inactive { background: #f1f5f9; color: #475569; }
    .tab-inactive:hover { background: #e2e8f0; }
  </style>
</head>
<body class="p-4 sm:p-8 space-y-6 min-h-screen flex flex-col">

  <!-- Header Banner -->
  <div class="glass-header p-6 rounded-3xl shadow-sm flex flex-wrap items-center justify-between gap-4 border-l-8 border-l-purple-600">
    <div class="flex items-center gap-4">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-purple-700 to-pink-500 text-white flex items-center justify-center text-3xl shadow-lg shadow-purple-500/30">
        <i class="fa-solid fa-images"></i>
      </div>
      <div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">GALERI LAPORAN BERGAMBAR</h1>
        <p class="text-xs text-slate-500 font-semibold mt-0.5">
          <i class="fa-solid fa-chart-pie mr-1 text-purple-600"></i> Bahagian Perancangan • Jabatan Perikanan Sabah
        </p>
      </div>
    </div>
    
    <div class="flex flex-wrap items-center gap-3">
      <span class="inline-flex items-center px-4 py-2 rounded-2xl text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 shadow-xs">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-2.5 animate-pulse"></span> Google Drive Live Folder
      </span>
      <a href="https://drive.google.com/drive/folders/1vTLtFmY1Ni6YxhoKllIGMLg0CrulZlR3?usp=sharing" target="_blank" class="px-5 py-2.5 bg-gradient-to-r from-purple-700 to-pink-600 hover:from-purple-800 hover:to-pink-700 text-white text-xs font-extrabold rounded-2xl transition flex items-center gap-2 shadow-md shadow-purple-700/20 active:scale-95">
        <i class="fa-brands fa-google-drive text-sm"></i> Buka Folder & Muat Naik
      </a>
    </div>
  </div>

  <!-- Bar Kawalan Paparan -->
  <div class="bg-white p-4 rounded-3xl shadow-xs border border-slate-200 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-2">
      <button id="btnGrid" onclick="switchView('grid')" class="tab-active px-4 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2">
        <i class="fa-solid fa-grip"></i> Paparan Grid Bergambar
      </button>
      <button id="btnList" onclick="switchView('list')" class="tab-inactive px-4 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2">
        <i class="fa-solid fa-list"></i> Paparan Senarai Fail
      </button>
    </div>

    <div class="flex items-center gap-3">
      <span class="text-xs text-slate-500 font-semibold hidden sm:inline">
        <i class="fa-solid fa-circle-info text-purple-600 mr-1"></i> Klik pada mana-mana gambar/PDF di bawah untuk pratonton penuh
      </span>
      <button onclick="reloadDriveFrame()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition flex items-center gap-1.5">
        <i class="fa-solid fa-rotate"></i> Segar Semula
      </button>
    </div>
  </div>

  <!-- Paparan Langsung Folder Google Drive (Grid / List) -->
  <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden flex-grow min-h-[68vh] relative">
    <iframe 
      id="driveFrame"
      src="https://drive.google.com/embeddedfolderview?id=1vTLtFmY1Ni6YxhoKllIGMLg0CrulZlR3#grid" 
      class="w-full h-full min-h-[68vh] border-0"
      title="Galeri Laporan Bergambar Google Drive">
    </iframe>
  </div>

  <script>
    const FOLDER_ID = "1vTLtFmY1Ni6YxhoKllIGMLg0CrulZlR3";
    let currentMode = "grid";

    function switchView(mode) {
      currentMode = mode;
      const frame = document.getElementById('driveFrame');
      const btnGrid = document.getElementById('btnGrid');
      const btnList = document.getElementById('btnList');

      if (mode === 'grid') {
        btnGrid.className = "tab-active px-4 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2";
        btnList.className = "tab-inactive px-4 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2";
        frame.src = `https://drive.google.com/embeddedfolderview?id=${FOLDER_ID}#grid`;
      } else {
        btnList.className = "tab-active px-4 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2";
        btnGrid.className = "tab-inactive px-4 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-2";
        frame.src = `https://drive.google.com/embeddedfolderview?id=${FOLDER_ID}#list`;
      }
    }

    function reloadDriveFrame() {
      const frame = document.getElementById('driveFrame');
      frame.src = `https://drive.google.com/embeddedfolderview?id=${FOLDER_ID}#${currentMode}`;
    }
  </script>
</body>
</html>
